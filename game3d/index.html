<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Convoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/game3d/style.css">
<script type="importmap">
{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#f2c94c" stroke="#7a5414" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="#7a5414" stroke-width="1.6"/></symbol>
  <symbol id="i-chest" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="11" rx="1.5" fill="#a0652e" stroke="#2b1a0b" stroke-width="1.8"/><path d="M3 9a9 5 0 0 1 18 0" fill="#c27f3e" stroke="#2b1a0b" stroke-width="1.8"/><rect x="10" y="11" width="4" height="4" fill="#f2c94c" stroke="#2b1a0b" stroke-width="1.2"/></symbol>
  <symbol id="i-crown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 18l2-11 5 5 2-7 2 7 5-5 2 11z"/></symbol>
  <symbol id="i-bread" viewBox="0 0 24 24"><path d="M4 13c0-5 16-5 16 0v5H4z" fill="#d79a4e" stroke="#3b220a" stroke-width="1.8"/><path d="M8 11l1 3M12 10.5v3.5M16 11l-1 3" stroke="#3b220a" stroke-width="1.4"/></symbol>
  <symbol id="i-banner" viewBox="0 0 24 24"><path d="M6 3v18" stroke="#e9d18c" stroke-width="2"/><path d="M6 4h12l-3 4 3 4H6z" fill="#c0392b" stroke="#2b1a0b" stroke-width="1.4"/></symbol>
  <symbol id="i-here" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.6"/></symbol>
  <symbol id="i-travel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor"/></symbol>
  <symbol id="i-biz" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10l9-6 9 6"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
  <symbol id="i-jobs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 5l6 6-3 3-6-6z"/><path d="M11.5 9.5L3 18l3 3 8.5-8.5"/></symbol>
  <symbol id="i-market" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3v17M5 6h14M8 20h8"/><path d="M5 6l-3 6a3 3 0 0 0 6 0z"/><path d="M19 6l-3 6a3 3 0 0 0 6 0z"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H10l-5 4v-4H4z"/></symbol>
  <symbol id="i-log" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></symbol>
  <symbol id="i-scroll" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 4h11a3 3 0 0 1 3 3v13H9a3 3 0 0 1-3-3z"/><path d="M10 9h6M10 13h6"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20V4M4 20h16"/><path d="M7 15l4-5 3 3 5-7"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/><path d="M4 20a2 2 0 0 0 2 2h13v-4"/><path d="M9 7h6"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l12 7-12 7z"/></symbol>
</defs></svg>

<div id="scene"></div>
<div id="labels"></div>

<div id="topbar">
  <div class="res" title="Cash in your pocket"><svg><use href="#i-coin"/></svg><b class="c-gold" id="t-cash">&ndash;</b></div>
  <div class="res" title="Net worth: cash, goods, land and businesses"><svg><use href="#i-chest"/></svg><b id="t-worth">&ndash;</b></div>
  <div class="res c-blue" title="Your rank among every citizen"><svg><use href="#i-crown"/></svg><b id="t-rank">&ndash;</b></div>
  <div class="res" id="t-foodbox" title="How long until you must eat"><svg><use href="#i-bread"/></svg><b id="t-food">&ndash;</b></div>
  <div class="res" id="t-citybox" title="Your city against the others" style="display:none"><svg><use href="#i-banner"/></svg><b id="t-city"></b></div>
  <div class="grow"></div>
  <span class="spend" id="t-spend"></span>
  <span class="clock" id="t-clock">Day 1</span>
  <select id="t-pace" title="Game speed">
    <option value="3">1 hr = 20 min</option><option value="6">1 hr = 10 min</option>
    <option value="12">1 hr = 5 min</option><option value="30">1 hr = 2 min</option>
    <option value="60">1 hr = 1 min</option><option value="120">1 hr = 30 s</option>
  </select>
  <button class="tbtn" id="t-pause" title="Pause / play">PAUSE</button>
  <a class="tbtn" href="/map" title="The whole-valley map, with boards" style="text-decoration:none">MAP</a>
  <button class="tbtn" id="t-menu">MENU</button>
</div>

<nav id="buildbar" class="frame"><div class="bb-h">Build</div><div id="bb-items"></div></nav>
<div id="leftcol">
  <section id="nextmove" class="frame gold"><h4>Next move <button class="mini" id="nm-hide" title="Hide">&ndash;</button></h4><div id="nm-body"></div></section>
  <section id="goals" class="frame"><h4><span>First day</span> <small id="g-count"></small> <button class="mini" id="g-hide" title="Hide">&ndash;</button></h4><div id="g-body"></div></section>
</div>
<section id="lboard" class="frame gold" title="Click for the full rankings">
  <h4>Richest citizens <small id="lb-sub"></small></h4>
  <div id="lb-cities"></div>
  <div id="lb-rows"></div>
  <div id="lb-chase"></div>
</section>
<div id="eprompt" class="frame gold"><b>E</b><span id="ep-text"></span></div>
<div id="ribbon" class="frame"><span id="r-main">&hellip;</span><small id="r-sub"></small></div>
<div id="note"></div>

<div id="advisors">
  <button data-tab="here"><svg><use href="#i-here"/></svg><span class="tip">Where you stand</span></button>
  <button data-tab="travel"><svg><use href="#i-travel"/></svg><span class="tip">Travel</span></button>
  <button data-tab="business"><svg><use href="#i-biz"/></svg><span class="tip">Your businesses &amp; land</span></button>
  <button data-tab="jobs"><svg><use href="#i-jobs"/></svg><span class="tip">Jobs &amp; hiring</span><i class="badge" id="b-jobs"></i></button>
  <button data-tab="market"><svg><use href="#i-market"/></svg><span class="tip">Market</span></button>
  <button data-tab="chat"><svg><use href="#i-chat"/></svg><span class="tip">Chat</span><i class="badge" id="b-chat"></i></button>
  <button data-tab="news"><svg><use href="#i-log"/></svg><span class="tip">News</span><i class="badge" id="b-news"></i></button>
  <button data-tab="ranks"><svg><use href="#i-crown"/></svg><span class="tip">Rankings</span></button>
  <button data-tab="ledger"><svg><use href="#i-chart"/></svg><span class="tip">Ledger: how you are doing</span></button>
  <button data-tab="guide"><svg><use href="#i-book"/></svg><span class="tip">Guide: what makes what</span></button>
</div>

<div id="unit">
  <div id="portrait"><canvas id="portrait-c" width="236" height="236"></canvas></div>
  <div id="unitcard" class="frame gold">
    <div class="name" id="u-name">&hellip;</div>
    <div class="sub" id="u-sub"></div>
    <div class="stat"><span>Doing</span><b id="u-doing">&ndash;</b></div>
    <div class="stat"><span>Food</span><b id="u-food">&ndash;</b></div>
    <div class="bar"><i id="u-foodbar" style="width:100%"></i></div>
    <div class="stat"><span>Carrying</span><b id="u-carry">&ndash;</b></div>
    <div id="unitacts"></div>
  </div>
</div>

<div id="prompt" class="frame">YOU ARE IDLE &mdash; WHAT NEXT?</div>
<div id="minimapbox" class="frame gold"><canvas id="minimap" width="500" height="356"></canvas><div class="cap" id="mm-cap"></div></div>

<section id="panel" class="frame gold" aria-live="polite">
  <header><h2 id="p-title"></h2><button class="x" id="p-close" title="Close (Esc)">&times;</button></header>
  <div id="pbody"></div>
</section>

<div id="toasts"></div>
<div id="tooltip"></div>
<div id="selbar" class="frame gold"></div>
<div id="holdings"></div>
<div id="keys"><b>WASD</b>/<b>arrows</b> move &middot; <b>Shift</b> run &middot; <b>drag</b> to look &middot; <b>click</b> or <b>E</b> at a building or person &middot; <b>F</b> find me</div>
<div id="travel"><div class="box frame gold"><h2 id="tr-title">Travelling</h2><div id="tr-sub" class="tip"></div></div></div>
<div id="cover"><div class="box"><h1>CONVOY</h1><p id="cover-msg">Raising the valley&hellip;</p><div class="meter"><i id="cover-bar"></i></div></div></div>

<script>window.GAME = {token: "__TOKEN__", you: "__YOU__"};</script>
<script type="module" src="/game3d/main.js"></script>
</body>
</html>
